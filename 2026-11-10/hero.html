<!doctype html><html><head><style>
  html,body{margin:0;padding:0}
  .c{width:1200px;height:600px;position:relative;overflow:hidden;background:#0D1C30;font-family:Poppins,sans-serif}
  .glow{position:absolute;right:-160px;top:-120px;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle, rgba(234,139,51,.28) 0%, rgba(234,139,51,0) 65%)}
  .grid{position:absolute;inset:0;opacity:.07;
        background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
        background-size:40px 40px}
  .bar{position:absolute;left:0;top:0;width:14px;height:600px;background:#EA8B33}
  .txt{position:absolute;left:84px;top:150px;width:690px}
  .kick{display:inline-block;background:#EA8B33;color:#0D1C30;font-weight:700;font-size:22px;
        letter-spacing:3px;padding:10px 22px;border-radius:40px;text-transform:uppercase}
  h1{color:#fff;font-weight:700;font-size:62px;line-height:1.08;margin:34px 0 0}
  h1 em{font-style:normal;color:#EA8B33}
  .sub{color:#C9D2DE;font-family:Inter,sans-serif;font-size:26px;margin-top:22px;line-height:1.35}
  .icon{position:absolute;right:110px;top:150px;width:300px;height:300px;border-radius:50%;
        border:3px solid rgba(234,139,51,.55);display:flex;align-items:center;justify-content:center;
        background:rgba(13,28,48,.6)}
  .badge{position:absolute;right:122px;top:162px;width:76px;height:76px;border-radius:50%;background:#EA8B33;
        color:#0D1C30;font-weight:700;font-size:50px;line-height:76px;text-align:center;box-shadow:0 0 0 8px #0D1C30}
  .logo{position:absolute;left:84px;bottom:52px;height:46px}
  .tag{position:absolute;right:84px;bottom:58px;color:#8A97A8;font-family:Inter,sans-serif;font-size:20px;letter-spacing:2px}
</style></head><body><div class="c">
  <div class="grid"></div><div class="glow"></div>
  <div class="txt"><span class="kick">Cyber Tip of the Week</span>
    <h1>"Hey, it's your boss."<br><em>No, it's not.</em></h1><div class="sub">A gift card "favor" from the boss is a classic scam.</div></div>
  <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 96 96" fill="none" stroke="#EA8B33" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="color:#EA8B33"><circle cx="48" cy="32" r="16"/><path d="M16 86a32 32 0 0 1 64 0"/></svg></div>
  <div class="badge">!</div>
  
</div></body></html>
